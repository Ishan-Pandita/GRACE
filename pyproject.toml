[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
python_classes = "Test*"
addopts = "-v --tb=short"

[project]
name = "grace"
version = "1.0.0"
description = "GRACE: Graph-Based Prompt Compression for Edge LLMs"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2.0",
    "transformers>=4.41.0",
    "sentence-transformers>=2.7.0",
    "datasets>=2.20.0",
    "networkx>=3.2.1",
    "nltk>=3.8.0",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.7.0",
    "requests>=2.31.0",
    "numpy>=1.26.0",
    "scikit-learn>=1.4.0",
    "psutil>=5.9.0",
    "matplotlib>=3.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "black>=24.0.0",
    "ruff>=0.4.0",
]
